<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follower alert</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:system-ui,sans-serif}#stage{transform-origin:top left;display:flex;align-items:center;justify-content:center}#card{opacity:0;visibility:hidden;width:90%;height:86%;padding:4%;display:flex;gap:4%;align-items:center;background:var(--panel);color:var(--ink);border:1px solid var(--ink)}.mark{flex:0 0 16%;aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--ink);transform:rotate(45deg)}.mark span{font-size:64px;transform:rotate(-45deg)}.copy{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:5px}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;font:12px/1.2 ui-monospace,monospace;overflow-wrap:anywhere}h1{font-size:clamp(20px,3vw,32px);line-height:1.05;margin:0;font-weight:500}#name{font-weight:750;font-size:48px;line-height:1.1;height:42%;margin:0;overflow-wrap:anywhere;unicode-bidi:plaintext}#footer{font:12px/1.3 ui-monospace,monospace;margin:0;overflow-wrap:anywhere}.editorial .mark{display:none}.editorial h1,.editorial #name{font-family:Georgia,serif}.editorial #card{border-width:0 0 5px}.minimal .mark{border-radius:50%;transform:none}.minimal .mark span{transform:none}.minimal #card{border:0}#preview{position:fixed;bottom:0;left:0;right:0;padding:10px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:#fff;color:#15212b;font:12px/1.4 system-ui}#preview[hidden]{display:none}button{min-height:44px;padding:8px 16px;border:1px solid #15212b;background:#fff;color:#15212b;cursor:pointer}button:hover{background:#dce4e8;color:#15212b}button:focus-visible{outline:3px solid #15212b;outline-offset:2px}
.copy{display:grid;grid-template-rows:14% 22% 48% 12%;gap:1%}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta span{min-width:0;height:100%;line-height:1.15}#event{text-align:right}#name{height:100%}h1,#footer{height:100%;overflow-wrap:anywhere}

:root{--ink:#efaa62;--panel:#242033}#stage{width:800px;height:400px}</style></head><body>
<main id="stage" data-od-id="alert-stage" aria-label="Follower alert">
<section id="card" data-od-id="alert-card" aria-live="polite" aria-atomic="true">
<div class="mark" aria-hidden="true"><span>+</span></div><div class="copy">
<div class="meta"><span id="brand"></span><span id="event"></span></div>
<h1 id="headline" data-od-id="alert-headline"></h1><p id="name" dir="auto" data-od-id="follower-name"></p><p id="footer"></p>
</div></section></main>
<aside id="preview" data-od-id="preview-controls" hidden><span>SYNTHETIC PREVIEW · NO TWITCH CONNECTION</span><button id="replay" data-od-id="replay">Replay</button><button id="cancel" data-od-id="cancel">Cancel</button><output id="result" aria-live="polite"></output></aside>
<script id="config" type="application/json">{"brandName":"After hours","eventLabel":"Autumn sessions","accent":"#efaa62","background":"#242033","headline":"You’re on the list","footer":"Stay a while","sampleFollower":"Écho ✨","width":800,"height":400,"duration":8,"styleDirection":"editorial","fontFile":"","brandGuide":""}</script>
<script>const c=JSON.parse(document.getElementById('config').textContent);document.body.classList.add(c.styleDirection);for(const [id,key]of Object.entries({brand:'brandName',event:'eventLabel',headline:'headline',footer:'footer'}))document.getElementById(id).textContent=c[key];</script><script>(function(root){
'use strict';
function validate(p){
 if(!p || typeof p!=='object' || p.type!=='follow' || typeof p.displayName!=='string' || !p.displayName.trim() || [...p.displayName].length>64) return null;
 if(p.id!==undefined && (typeof p.id!=='string' || p.id.length>128)) return null;
 return Object.freeze({type:'follow',displayName:p.displayName,...(p.id!==undefined?{id:p.id}:{})});
}
function createAdapter(driver,ready=Promise.resolve()){
 let queue=[],current=null,last=null,enabled=false,epoch=0; const ids=new Set();
 function next(){
  if(!enabled || current || !queue.length)return;
  current=queue.shift();last=current;const token=++epoch;
  driver.start(current,()=>{if(token!==epoch)return;driver.idle();current=null;next();});
 }
 function submit(p,replay=false){
  const value=validate(p);if(!value)return {status:'invalid'};
  if(!replay && value.id!==undefined && ids.has(value.id))return {status:'duplicate'};
  if(queue.length>=20)return {status:'queue-full'};
  if(!replay && value.id!==undefined){ids.add(value.id);if(ids.size>100)ids.delete(ids.values().next().value);}
  queue.push(value);next();return {status:'accepted'};
 }
 const api={play:p=>submit(p),replay:()=>last?submit(last,true):{status:'invalid'},cancel(){++epoch;queue=[];current=null;driver.stop();driver.idle();return {status:'cancelled'};},getState(){return {state:!enabled?'loading':current?'playing':'idle',queued:queue.length,current:current?{...current}:null,last:last?{...last}:null,rememberedIds:ids.size,capacity:20};}};
 ready.then(()=>{enabled=true;next();});return Object.freeze(api);
}
root.AlertAdapter={validate,createAdapter};
if(typeof module!=='undefined')module.exports=root.AlertAdapter;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(function(root){
'use strict';
// A deterministic paused timeline. Seeking never dispatches events.
function createComposition(card, config, reduced=false, clock=root){
 let time=0, frame=null, finish=null, origin=0;
 function seek(seconds){
  time=Math.max(0,Math.min(config.duration,seconds));
  const visible=time>0 && time<config.duration;
  const edge=Math.min(time/.45,(config.duration-time)/.45,1);
  card.style.opacity=visible?String(reduced?1:Math.max(0,edge)): '0';
  card.style.visibility=visible?'visible':'hidden';
  card.style.transform=reduced?'none':`translateY(${(1-Math.max(0,edge))*18}px)`;
  return time;
 }
 function pause(){if(frame!==null)clock.cancelAnimationFrame(frame);frame=null;}
 function tick(now){seek((now-origin)/1000);if(time>=config.duration){frame=null;const done=finish;finish=null;if(done)done();}else frame=clock.requestAnimationFrame(tick);}
 const api={seek,pause,getTime:()=>time,duration:config.duration,
  start(done){pause();finish=done;origin=clock.performance.now();seek(0);frame=clock.requestAnimationFrame(tick);},
  idle(){pause();finish=null;seek(0);}};
 api.idle();return api;
}
root.AlertComposition={createComposition};
if(typeof module!=='undefined')module.exports=root.AlertComposition;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(function(){
'use strict';
const config=JSON.parse(document.getElementById('config').textContent);
const card=document.getElementById('card'),stage=document.getElementById('stage');
const name=document.getElementById('name');
const composition=AlertComposition.createComposition(card,config,matchMedia('(prefers-reduced-motion: reduce)').matches);
window.AlertTimeline=composition;
// Fit every label inside its allocated row without truncating untrusted copy.
const ready=document.fonts.ready.then(()=>{
for(const [id,max]of [['brand',12],['event',12],['headline',32],['footer',12]]){
 const node=document.getElementById(id);node.style.fontSize=max+'px';
 for(let size=max;size>6 && (node.scrollHeight>node.clientHeight || node.scrollWidth>node.clientWidth);size--)node.style.fontSize=(size-1)+'px';
}
});
function fit(){const scale=Math.min(1,innerWidth/config.width,innerHeight/config.height);stage.style.transform=`scale(${scale})`;}
fit();addEventListener('resize',fit);
function setName(value){
 name.textContent=value;name.style.fontSize='48px';
 for(let size=48;size>8 && (name.scrollHeight>name.clientHeight || name.scrollWidth>name.clientWidth);size--)name.style.fontSize=(size-1)+'px';
}
window.StreamAlert=AlertAdapter.createAdapter({start(payload,done){setName(payload.displayName);composition.start(done);},stop(){composition.pause();},idle(){composition.idle();}},ready);
if(new URLSearchParams(location.search).get('preview')==='1'){
 document.getElementById('preview').hidden=false;
 const result=document.getElementById('result');
 document.getElementById('replay').onclick=()=>result.textContent=StreamAlert.replay().status;
 document.getElementById('cancel').onclick=()=>result.textContent=StreamAlert.cancel().status;
 ready.then(()=>{result.textContent=StreamAlert.play({type:'follow',displayName:config.sampleFollower,id:'synthetic-001'}).status;});
}
})();
</script>
</body></html>
